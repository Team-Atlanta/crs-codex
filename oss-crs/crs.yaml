name: crs-codex
type:
  - bug-fixing
version: cli-0.47.0
docker_registry: ghcr.io/team-atlanta/crs-codex

prepare_phase:
  hcl: oss-crs/docker-bake.hcl

target_build_phase:
  - name: default-build
    dockerfile: oss-crs/builder.Dockerfile
    outputs:
      - build
      - src

crs_run_phase:
  patcher:
    dockerfile: oss-crs/patcher.Dockerfile
    additional_env:
      # Default values. To override, set additional_env in compose yaml.
      CRS_AGENT: codex
      # CODEX_CLI_VERSION: "0.104.0"  # Optional prepare-phase override for base image build
      # CODEX_MODEL: gpt-5.4  # Optional override (default if unset)
      # AGENT_TIMEOUT: "0"  # seconds, 0 = no limit (default)

supported_target:
  mode:
    - full
    - delta
  language:  # language-agnostic — agent edits source, builder sidecar handles compilation
    - c
    - c++
    - jvm
  sanitizer:
    - address
  architecture:
    - x86_64

required_llms:
  - gpt-5.4
  # Codex variants currently expose canonical IDs without dated snapshot suffixes.
